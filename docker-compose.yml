services:
  api:
    build: .
    container_name: iot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: iot_solutions
      SIMULATOR_INTERVAL: "5"
      SIMULATOR_ENABLED: "1"
      METRIC_RETENTION_DAYS: "30"
      LOG_LEVEL: INFO
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: iot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0
    container_name: iot-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
