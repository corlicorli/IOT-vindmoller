services:
  api:
    build: .
    container_name: iot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: iot_solutions
      METRIC_RETENTION_DAYS: "30"
      LOG_LEVEL: INFO
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: iot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0
    container_name: iot-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      # 3001 for at undgå konflikt med andre lokale dev-servere på 3000
      - "3001:3000"
    environment:
      # Anonym adgang — ingen login-form, alle får Admin-rolle (kun til lokal demo)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      # Auto-installer Infinity-plugin der polliner JSON-endpoints
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - api
      - prometheus

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: iot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  mongo_data:
  grafana_data:
  prometheus_data:
